# GitHub Pages configuration for the OzBridge documentation site.
# Served from the `docs/` folder of the `main` branch.

title: OzBridge
tagline: Warp Oz agents in any IDE, via MCP
description: >-
  OzBridge is an open-source Model Context Protocol (MCP) server and VS Code
  extension that runs Warp Oz cloud and local agents from any MCP-compatible
  client — GitHub Copilot Chat, Claude Code, Cursor and Codex CLI.

url: https://sena-labs.github.io
baseurl: /OzBridge
lang: en

author:
  name: Sena Labs

twitter:
  card: summary_large_image

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Every markdown document renders inside the site shell, including the
# reference pages that carry no front matter of their own.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/social-card.jpg

# Internal process documents: kept in the repository, not published as pages.
exclude:
  - CREATING-GIFS.md
  - PUBLISHING.md
  - VERIFICATION-v0.5.0.md
  - MILESTONE-v0.7.md
  - MILESTONE-v0.8.md
  - MILESTONE-v0.9.md
  - MILESTONE-v1.0.md
  - generate_gifs.py
  - launch/
