name: Publish extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + package only, no publish)'
        type: boolean
        default: false

permissions:
  contents: write # required to attach the VSIX to the GitHub Release

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & package VSIX
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      vsix: ${{ steps.pkg.outputs.vsix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The extension, the standalone MCP server and the MCP registry manifest
      # carry three independent version fields. When they drift, the npm package
      # ships while `mcp-publisher` silently keeps serving the older manifest —
      # which is exactly how the registry ended up stranded on 1.2.1. Fail the
      # release here instead of discovering the skew in the registry weeks later.
      - name: Check version consistency
        run: |
          set -euo pipefail
          EXT=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./packages/oz-mcp-server/package.json').version")
          MANIFEST=$(node -p "require('./server.json').version")
          PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          MCP_NAME=$(node -p "require('./packages/oz-mcp-server/package.json').mcpName")
          SRV_NAME=$(node -p "require('./server.json').name")

          echo "extension=$EXT mcp-server=$SRV server.json=$MANIFEST server.json/packages[0]=$PKG_VERSION"
          if [ "$EXT" != "$SRV" ] || [ "$EXT" != "$MANIFEST" ] || [ "$EXT" != "$PKG_VERSION" ]; then
            echo "::error::Version skew — align package.json, packages/oz-mcp-server/package.json and server.json"
            exit 1
          fi

          # The registry verifies npm ownership by matching `mcpName` against the
          # server name; a mismatch is rejected at publish time.
          if [ "$MCP_NAME" != "$SRV_NAME" ]; then
            echo "::error::mcpName ($MCP_NAME) does not match server.json name ($SRV_NAME)"
            exit 1
          fi

      - name: Type-check
        run: npm run compile

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Package VSIX
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="ozbridge-${VERSION}.vsix"
          npx @vscode/vsce package --no-dependencies -o "$VSIX"
          ls -lh "$VSIX"
          npx @vscode/vsce ls "$VSIX" | head -n 40
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ozbridge-${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.vsix }}
          retention-days: 30

  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: build
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: ozbridge-${{ needs.build.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          set -euo pipefail
          # `:-` matters here: this step runs under `set -u`, which the step
          # did not use before the idempotency guard was added.
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::VSCE_PAT secret is not set — skipping Marketplace publish"
            exit 0
          fi

          # Publishing is not idempotent: vsce rejects a version that is
          # already live with a hard error. Without this guard, re-running a
          # release after a partial failure — or tagging a version that was
          # published by hand — fails here and strands the Open VSX and
          # GitHub Release jobs behind it. Query first, skip if already out.
          # A failed/empty query falls through to the publish attempt, so the
          # guard can never silently suppress a genuine first release.
          if npx @vscode/vsce show sena-labs.ozbridge --json 2>/dev/null \
             | jq -e --arg V "$VERSION" '.versions | map(.version) | index($V)' >/dev/null 2>&1; then
            echo "::notice::Marketplace already serves ${VERSION} — nothing to publish"
            exit 0
          fi

          npx @vscode/vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"

  publish-openvsx:
    name: Publish to Open VSX
    needs: build
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: ozbridge-${{ needs.build.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          set -euo pipefail
          # `:-` matters here: this step runs under `set -u`, which the step
          # did not use before the idempotency guard was added.
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT secret is not set — skipping Open VSX publish"
            exit 0
          fi

          # Same idempotency guard as the Marketplace job: ovsx also rejects a
          # duplicate version. Open VSX answers 200 for a published version and
          # 404 otherwise, so only an explicit 200 skips — any other status
          # (including a network failure) falls through to the publish attempt.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://open-vsx.org/api/sena-labs/ozbridge/${VERSION}" || echo 000)
          if [ "$STATUS" = '200' ]; then
            echo "::notice::Open VSX already serves ${VERSION} — nothing to publish"
            exit 0
          fi

          npx ovsx publish "$VSIX" -p "$OVSX_PAT"

  publish-npm:
    name: Publish MCP server to npm
    needs: build
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing: the CLI mints a short-lived OIDC token instead of
      # reading NODE_AUTH_TOKEN. The publisher is bound to sena-labs/OzBridge +
      # this workflow filename on npmjs.com, so no long-lived secret exists to
      # leak or rotate, and provenance attestations are generated automatically.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing has two independent floors — Node >= 22.14 and npm
      # >= 11.5.1 — and the npm bundled with a given Node line can sit below the
      # npm floor. Upgrading explicitly keeps this job correct no matter which
      # npm that Node image happens to ship.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Publish @sena-labs/oz-mcp-server
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Same idempotency contract as the Marketplace and Open VSX jobs: npm
          # rejects a duplicate version outright, which would strand the MCP
          # registry job behind it on a re-run. An empty/failed query falls
          # through to the publish attempt so a genuine first release is never
          # suppressed.
          if npm view "@sena-labs/oz-mcp-server@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::npm already serves ${VERSION} — nothing to publish"
            exit 0
          fi

          # The package is scoped, so npm defaults to a restricted (paid) publish
          # unless access is set explicitly.
          npm publish --workspace @sena-labs/oz-mcp-server --access public

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [build, publish-npm]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to the registry under io.github.sena-labs/*
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The registry proves npm ownership by fetching the published package and
      # matching its `mcpName` against the server name. A local-only rename —
      # server.json and packages/oz-mcp-server/package.json updated, but the
      # version already live on npm still carrying the old mcpName — is rejected
      # with an opaque ownership error. Fail here with the actual mismatch.
      - name: Verify npm ownership metadata
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          SRV_NAME=$(node -p "require('./server.json').name")
          PUBLISHED=$(npm view "@sena-labs/oz-mcp-server@${VERSION}" mcpName 2>/dev/null || true)
          if [ -z "$PUBLISHED" ]; then
            echo "::error::@sena-labs/oz-mcp-server@${VERSION} is not on npm, or carries no mcpName"
            exit 1
          fi
          if [ "$PUBLISHED" != "$SRV_NAME" ]; then
            echo "::error::npm mcpName ($PUBLISHED) != server.json name ($SRV_NAME) — a renamed server needs a version bump so npm ships the new mcpName"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

  github-release:
    name: Create GitHub Release
    needs: build
    if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: ozbridge-${{ needs.build.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ needs.build.outputs.vsix }}
          generate_release_notes: true
