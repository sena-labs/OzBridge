name: Publish extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + package only, no publish)'
        type: boolean
        default: false

permissions:
  contents: write # per creare la GitHub Release con il VSIX allegato

jobs:
  publish:
    name: Build, test, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          npx @vscode/vsce package --no-dependencies -o warp-vsc-bridge-$VERSION.vsix

      - name: Verify VSIX contents
        run: |
          ls -lh warp-vsc-bridge-*.vsix
          npx @vscode/vsce ls warp-vsc-bridge-${{ env.VERSION }}.vsix

      - name: Publish to VS Code Marketplace
        if: ${{ inputs.dry_run != true }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce publish --packagePath warp-vsc-bridge-${{ env.VERSION }}.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ inputs.dry_run != true }}
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          npx ovsx publish warp-vsc-bridge-${{ env.VERSION }}.vsix -p "$OVSX_TOKEN"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: warp-vsc-bridge-${{ env.VERSION }}.vsix
          generate_release_notes: true

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-vsc-bridge-${{ env.VERSION }}
          path: warp-vsc-bridge-*.vsix
          retention-days: 30
