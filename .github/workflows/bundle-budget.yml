name: Bundle budget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bundle-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-bundle-size:
    name: Assert dist/extension.js ≤ 125 KB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Enforce 125 KB bundle budget
        run: |
          BUDGET_BYTES=$((125 * 1024))
          if [ ! -f dist/extension.js ]; then
            echo "::error::dist/extension.js was not produced"
            exit 1
          fi
          SIZE=$(wc -c < dist/extension.js)
          KB=$(awk "BEGIN { printf \"%.2f\", $SIZE/1024 }")
          echo "Bundle size: ${SIZE} bytes (${KB} KB) · budget: 125.00 KB"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bundle size | ${KB} KB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Budget | 125.00 KB |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Bundle size ${KB} KB exceeds the 125 KB budget"
            exit 1
          fi
