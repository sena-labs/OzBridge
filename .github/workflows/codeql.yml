# Static analysis via GitHub CodeQL.
#
# v1.0 deliverable Q (security gates). Runs on every PR + main push and
# weekly on a Monday-morning cron so a fresh database catches CVEs that
# land between releases. Findings surface in the repository's Security
# tab and block PRs when the result is `error`-severity.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Code Scanning availability
        id: code_scanning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS \
            -o /tmp/code-scanning-response.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1")

          if [ "${http_code}" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          echo "::warning::Code Scanning API unavailable for ${GITHUB_REPOSITORY} (HTTP ${http_code}). Skipping CodeQL analyze/upload to avoid a false failing check."
          cat /tmp/code-scanning-response.json || true

      - name: Setup Node.js 22
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Initialize CodeQL
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Install dependencies
        if: steps.code_scanning.outputs.enabled == 'true'
        run: npm ci

      - name: Build extension
        if: steps.code_scanning.outputs.enabled == 'true'
        run: npm run build

      - name: Perform CodeQL analysis
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

      - name: Skip notice (Code Scanning disabled)
        if: steps.code_scanning.outputs.enabled != 'true'
        run: |
          echo 'Code scanning is disabled for this repository; CodeQL scan/upload skipped by workflow guard.'
