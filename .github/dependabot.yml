# Dependabot configuration.
#
# v1.0 deliverable Q (security gates). Dependabot watches three
# ecosystems on a weekly cadence and groups related updates so PR
# noise stays manageable.
version: 2

updates:
  # ── Root package.json (devDeps + the single workspace runtime dep) ──
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Rome'
    open-pull-requests-limit: 5
    reviewers:
      - 'sena-labs/maintainers'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      typescript-toolchain:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'esbuild'
          - 'tsx'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      vscode-platform:
        patterns:
          - '@vscode/*'
    ignore:
      # @types/vscode and @types/node must track the engines.vscode floor
      # (^1.96.0 → VS Code's bundled Node 20). Bumping the type stubs ahead
      # of the lowest supported runtime would surface APIs that are not
      # guaranteed to exist when the extension actually runs. @types/vscode
      # advances by minor per VS Code release, so minor is ignored too.
      - dependency-name: '@types/vscode'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # ── packages/copilot-chat-toolkit workspace ─────────────────────────
  - package-ecosystem: 'npm'
    directory: '/packages/copilot-chat-toolkit'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:30'
      timezone: 'Europe/Rome'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(toolkit-deps)'
      include: 'scope'
    ignore:
      # Mirror the root config: the toolkit pins @types/vscode to the
      # extension's engines.vscode floor (1.96.0) via both peerDependencies
      # and devDependencies. Bumping the type stubs ahead of the lowest
      # supported VS Code runtime would surface APIs that are not guaranteed
      # to exist when the extension actually runs. @types/vscode advances by
      # minor per VS Code release, so both minor and major bumps are ignored.
      - dependency-name: '@types/vscode'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # ── GitHub Actions ──────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Rome'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(actions)'
      include: 'scope'
    groups:
      gh-actions-core:
        patterns:
          - 'actions/*'
          - 'github/codeql-action'
    ignore:
      # security.yml is tuned for gitleaks-action v2's PR-diff scoping
      # (GET /pulls/:n/commits + the pull-requests:read scope) and its
      # GITLEAKS_ENABLE_* env contract. A major bump must be validated
      # against that workflow by hand before adopting.
      - dependency-name: 'gitleaks/gitleaks-action'
        update-types:
          - 'version-update:semver-major'
