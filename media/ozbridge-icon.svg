<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <!--
    OzBridge activity-bar / view icon. Monochrome silhouette using
    `currentColor` so VS Code can theme it (white / black / accent).
    Mirrors the marketplace icon (`ozbridge-icon.png`): a stylised
    mascot crouched in front of a halo of sun rays. Kept intentionally
    simple so it remains legible at 16-24 px.
  -->
  <!-- sun rays radiating from a central pivot -->
  <g>
    <rect x="11.4" y="1.2" width="1.2" height="6" rx="0.5"/>
    <rect x="11.4" y="1.2" width="1.2" height="6" rx="0.5" transform="rotate(25 12 7.2)"/>
    <rect x="11.4" y="1.2" width="1.2" height="6" rx="0.5" transform="rotate(-25 12 7.2)"/>
    <rect x="11.4" y="1.2" width="1.2" height="6" rx="0.5" transform="rotate(50 12 7.2)"/>
    <rect x="11.4" y="1.2" width="1.2" height="6" rx="0.5" transform="rotate(-50 12 7.2)"/>
  </g>
  <!-- mascot silhouette: rounded back + head with ear, on a small ground line -->
  <path d="M3.2 17.4
           C 3.2 12.9, 7.8 10.0, 12.0 10.0
           C 14.5 10.0, 16.8 11.0, 18.0 12.6
           L 19.4 11.4
           C 19.7 11.2, 20.1 11.3, 20.2 11.6
           L 20.6 12.8
           C 20.7 13.1, 20.5 13.4, 20.2 13.5
           L 19.0 13.7
           C 19.6 14.7, 19.9 15.9, 19.9 17.2
           L 19.9 17.8
           L 16.4 17.8
           L 16.4 17.2
           C 16.4 16.7, 16.0 16.4, 15.6 16.4
           C 15.1 16.4, 14.8 16.7, 14.8 17.2
           L 14.8 17.8
           L 8.6 17.8
           L 8.6 17.2
           C 8.6 16.7, 8.3 16.4, 7.8 16.4
           C 7.3 16.4, 7.0 16.7, 7.0 17.2
           L 7.0 17.8
           L 3.2 17.8
           Z"/>
  <!-- ground bar -->
  <rect x="2" y="18.8" width="20" height="1.4" rx="0.5"/>
</svg>
